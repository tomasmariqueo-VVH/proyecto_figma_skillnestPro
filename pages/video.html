<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Tomás Mariqueo | Matías Abarca | Gian Duque">
    <link rel="stylesheet" href="../static/css/video.css">
    <title>Video</title>
</head>

<body>
    <header class="header">
        <div class="nav-izquierda">
            <div class="menu-hamburguesa">
                <img src="" alt="icono">
            </div>
            <div class="logo">
                <img src="" alt="logo">
            </div>
        </div>
        <div class="nav-centro">
            <div class="input">
                <input type="text" placeholder="Search">
                <button class="contenedor-lupa">
                    <img src="" alt="lupa">
                </button>
            </div>
        </div>
        <div class="nav-derecha">
            <div class="crear">
                <button>
                    <img src="" alt="+">
                    <p>Create</p>
                </button>
            </div>
            <div class="perfil">
                <img src="" alt="perfil">
            </div>
        </div>
    </header>
    <main class="main">
        <div class="seccion-izquierda">
            <div class="seccion-video">
                <div class="contenedor-video">
                    <video controls poster="">
                        <source src="" type="video/mp4">
                        Tu navegador no soporta la reproducción de video.
                    </video>
                </div>
                <div class="cuerpo-video">
                    <div class="titulo-video">
                        <h1>chip</h1>
                    </div>
                    <div class="botones">
                        <div class="canal">
                            <div class="contenedor-perfil">
                                <img src="" alt="foto-perfil">
                            </div>
                            <div class="texto-canal">
                                <strong>doober43</strong>
                                <p>636K subscribers</p>
                            </div>
                        </div>
                        <div class="likes">
                            <div class="opcion">
                                <button class="button like" id="boton-like">
                                    <img class="imagen-icono" src="static/images/botonLike_neutral.png" alt="Like">
                                    <h4 id="valor-like">4</h4>
                                </button>
                            </div>
                            <div class="opcion">
                                <button class="button dislike" id="boton-dislike">
                                    <img class="imagen-icono" src="static/images/botonDislike_neutral.png"
                                        alt="Dislike">
                                    <h4 id="valor-dislike">0</h4>
                                </button>
                            </div>
                            <div class="opcion">
                                <button class="button compartir" id="boton-compartir">
                                    <img class="imagen-icono" src="static/images/botonCompartir_neutral.png"
                                        alt="Compartir">
                                    <h4>Compartir</h4>
                                </button>
                            </div>
                            <div class="opcion">
                                <button class="button agregar-cola" id="boton-agregarCola">
                                    <img class="imagen-icono" src="static/images/botonAgregar.png"
                                        alt="Agregar a la cola">
                                    <h4>Agregar a la cola</h4>
                                </button>
                            </div>
                            <div class="opcion puntos-suspensivos">
                                <button class="button">
                                    <img class="imagen-icono" src="static/images/puntosSuspensivos.png"
                                        alt="Más opciones">
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="descripcion-video">
                    <strong></strong>
                    <p></p>
                </div>
                <div class="seccion-comentarios">
                    <div class="parte-superior">
                        <div class="cantidad-comentarios">
                            <h2><strong>154, 989 Comments</strong></h2>
                        </div>
                        <div class="boton-sortBy">
                            <img src="" alt="icono">
                            <strong>Sort by</strong>
                        </div>
                    </div>
                    <div class="add-comment">
                        <div class="contenedor-miniImagen">
                            <img src="" alt="iconito">
                        </div>
                        <div class="input-comment">
                            <input type="text" placeholder="Add a comment...">
                        </div>
                    </div>
                    <div class="parte-central">
                        <div class="comentario">
                            <div class="parte-comentario-superior">
                                <div class="contenedor-mini-perfil">
                                    <img src="" alt="foto-perfil">
                                </div>
                                <div class="mini-texto-comentario">
                                    <strong>@insertUserName</strong>
                                    <p>636K subscribers</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="seccion-derecha"></div>
    </main>
    <footer class="footer"></footer>
    <script src="../static/js/script.js"></script>
</body>

</html>
